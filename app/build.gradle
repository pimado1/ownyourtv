plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// The release key lives outside the repository, in ~/.ownyourtv-signing/keystore.properties. Without it (a
// contributor's machine), release builds fall back to the debug key and cannot update a published install.
def signingProps = new Properties()
def signingFile = new File(System.getProperty('user.home'), '.ownyourtv-signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'app.ownyourtv'
    compileSdk 34
    defaultConfig {
        applicationId 'app.ownyourtv'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.7.3'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { resources { excludes += ['META-INF/*', 'kotlin/**', 'DebugProbesKt.bin'] } }
    androidResources { noCompress += 'apk' }
}
dependencies {
    implementation 'dev.mobile:dadb:1.2.9'
}

// The licences travel inside the APK: OwnYourTV's own, the third-party notices (CleanYourTV's MIT notice for the
// TV database among them) and the Apache licence text dadb and Kotlin ask for.
def notices = layout.buildDirectory.dir('generated/notices')
tasks.register('copyNotices', Copy) {
    from(rootProject.file('LICENSE')) { into 'licenses'; rename { 'OwnYourTV-MIT.txt' } }
    from(rootProject.file('NOTICE.md')) { into 'licenses'; rename { 'NOTICE.txt' } }
    from(rootProject.file('licenses/Apache-2.0.txt')) { into 'licenses' }
    into notices
}
android.sourceSets.main.assets.srcDir(notices)
tasks.named('preBuild') { dependsOn 'copyNotices' }
